<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="BITTE STIL Baukasten">
<meta name="application-version" content="__BITTE_STIL_VERSION__">
<meta name="build" content="__BITTE_STIL_BUILD__">
<title>BITTE STIL Baukasten</title>
<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --line:#000;
    --muted:#6b6b6b;
    --field-h:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0 !important;}
  html,body{background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  ::selection{background:#000;color:#fff;}
  .wrap{width:min(96vw,1680px);margin:0 auto;padding:28px 0 40px;}

  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:26px;}
  h1{font-size:clamp(22px,2.6vw,34px);font-weight:700;letter-spacing:-0.02em;}
  h1 .thin{font-weight:300;}
  .lang{display:inline-flex;border:1px solid #000;}
  .lang button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.08em;background:#fff;color:#000;
    border:0;padding:8px 18px;cursor:pointer;}
  .lang button.on{background:#000;color:#fff;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 26px;}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:6px;}
  .field label .soft{font-weight:400;text-transform:none;letter-spacing:0;}
  .field .hint{font-size:11px;color:var(--muted);margin-top:5px;}
  select,input[type=text]{
    width:100%;height:var(--field-h);border:1px solid var(--line);background:#fff;color:#000;
    font:inherit;font-size:15px;padding:0 12px;appearance:none;-webkit-appearance:none;outline:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='black' stroke-width='1.6' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;cursor:pointer;}
  select:focus,input:focus{outline:2px solid #000;outline-offset:-1px;}
  input.custom{margin-top:8px;display:none;}
  input.custom.show{display:block;}
  .check{display:flex;align-items:flex-start;gap:10px;margin-top:10px;cursor:pointer;font-size:14px;}
  .check input{width:18px;height:18px;accent-color:#000;flex:none;margin-top:2px;cursor:pointer;}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;border:1px solid #000;padding:12px 14px;}
  @media(max-width:900px){.checklist{grid-template-columns:1fr;}}
  .checklist label{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;font-weight:400;
    text-transform:none;letter-spacing:0;margin:0;cursor:pointer;line-height:1.35;}
  .checklist input{width:16px;height:16px;accent-color:#000;flex:none;margin-top:2px;cursor:pointer;}

  #palette{display:none;grid-column:1/-1;border:1px solid #000;padding:16px 18px 18px;margin-top:-6px;}
  #palette.show{display:block;}
  #palette .pt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;}
  #palette .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px;}
  @media(max-width:1100px){#palette .pgrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){#palette .pgrid{grid-template-columns:1fr;}}
  #palette .pgrid label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px;}
  #palette .phint{font-size:11px;color:var(--muted);margin-top:10px;}

  #exphead{margin-top:26px;border:1px solid #000;background:#fff;width:100%;
    display:flex;align-items:center;justify-content:space-between;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:12px 16px;cursor:pointer;}
  #exphead .chev{transition:transform .2s;font-size:13px;}
  #exphead.open .chev{transform:rotate(180deg);}
  #exphead .ctx{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12.5px;}
  #expbody{display:none;border:1px solid #000;border-top:0;padding:18px;}
  #expbody.show{display:block;}
  #expbody .egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 22px;}
  @media(max-width:1100px){#expbody .egrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){#expbody .egrid{grid-template-columns:1fr;}}
  #expbody .free{margin-top:16px;}
  #expbody .free label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}

  .out-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin:34px 0 0;border-top:2px solid var(--line);padding-top:22px;flex-wrap:wrap;}
  .out-head .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .output{border:1px solid var(--line);background:#fff;margin-top:14px;}
  #prompt{padding:22px 24px;font-size:16.5px;line-height:1.6;min-height:120px;white-space:pre-wrap;}
  #prompt .ph{background:#f2f2f2;box-shadow:inset 0 0 0 1px #d9d9d9;padding:1px 4px;}
  #prompt .fix{text-decoration:underline;text-underline-offset:3px;}
  .actions{display:flex;border-top:1px solid var(--line);}
  .actions button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    background:#000;color:#fff;border:0;padding:13px 26px;cursor:pointer;}
  .actions button:hover{background:#2a2a2a;}
  .actions .ok{align-self:center;margin-left:14px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s;}
  .actions .ok.show{opacity:1;}
  .why{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:115ch;}
  .why b{color:#000;}
  .why a{color:#000;}

  .rules{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid #000;}
  @media(max-width:900px){.rules{grid-template-columns:1fr;}}
  .rules div{padding:14px 18px;font-size:13.5px;border-right:1px solid #000;}
  .rules div:last-child{border-right:0;}
  @media(max-width:900px){.rules div{border-right:0;border-bottom:1px solid #000;}.rules div:last-child{border-bottom:0;}}
  .rules b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;}

  .colo{margin-top:34px;font-size:12px;color:var(--muted);}
  .colo a{color:#000;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>BITTE STIL <span class="thin">Baukasten</span></h1>
    <div class="lang">
      <button id="de" class="on" type="button">Deutsch</button>
      <button id="en" type="button">English</button>
    </div>
  </div>

  <div class="grid" id="form">

    <div class="field">
      <label for="zweck" data-s="l_zweck"></label>
      <select id="zweck"></select>
      <input class="custom" id="zweck_c" type="text" data-p="p_zweck">
    </div>

    <div class="field">
      <label for="typ" data-s="l_typ"></label>
      <select id="typ"></select>
      <input class="custom" id="typ_c" type="text" data-p="p_typ">
    </div>

    <div class="field">
      <label for="stil" data-s="l_stil"></label>
      <select id="stil"></select>
      <input class="custom" id="stil_c" type="text" data-p="p_stil">
      <p class="hint" id="stilhint"></p>
    </div>

    <div class="field">
      <label for="farbe" data-s="l_farbe"></label>
      <select id="farbe"></select>
      <input class="custom" id="farbe_c" type="text" data-p="p_farbe">
    </div>

    <div id="palette">
      <p class="pt" data-s="pal_t"></p>
      <div class="pgrid">
        <div><label for="col_p" data-s="pal_p"></label><input type="text" id="col_p" data-p="pp_p"></div>
        <div><label for="col_s" data-s="pal_s"></label><input type="text" id="col_s" data-p="pp_s"></div>
        <div><label for="col_a" data-s="pal_a"></label><input type="text" id="col_a" data-p="pp_a"></div>
        <div><label for="col_b" data-s="pal_b"></label><input type="text" id="col_b" data-p="pp_b"></div>
      </div>
      <p class="phint" data-s="pal_hint"></p>
    </div>

    <div class="field">
      <label for="format" data-s="l_format"></label>
      <select id="format"></select>
      <input class="custom" id="format_c" type="text" data-p="p_format">
    </div>

    <div class="field">
      <label for="detail" data-s="l_detail"></label>
      <select id="detail"></select>
    </div>

    <div class="field">
      <label for="grund" data-s="l_grund"></label>
      <select id="grund"></select>
    </div>

    <div class="field">
      <label for="stimmung" data-s="l_stimmung"></label>
      <select id="stimmung"></select>
    </div>

    <div class="field" style="grid-column:span 2;">
      <label data-s="l_bias"></label>
      <div class="checklist" id="biaslist"></div>
      <input id="bias_c" type="text" data-p="p_bias" style="margin-top:8px;">
      <p class="hint" data-s="bias_hint"></p>
    </div>

    <div class="field" style="grid-column:span 2;">
      <label for="nicht" data-s="l_nicht"></label>
      <input type="text" id="nicht" data-p="p_nicht">
    </div>

    <div class="field" style="grid-column:span 2;">
      <label data-s="l_serie"></label>
      <label class="check"><input type="checkbox" id="serie">
        <span data-s="serie_txt"></span></label>
    </div>

    <div class="field" style="grid-column:span 2;">
      <label data-s="l_alt"></label>
      <label class="check"><input type="checkbox" id="alttext">
        <span data-s="alt_txt"></span></label>
    </div>

  </div>

  <button id="exphead" type="button">
    <span><span data-s="exp_t"></span> <span class="ctx" id="expctx"></span></span>
    <span class="chev">▾</span>
  </button>
  <div id="expbody">
    <div class="egrid" id="expfields"></div>
    <div class="free">
      <label for="expfree" data-s="exp_free"></label>
      <input type="text" id="expfree" data-p="p_expfree">
    </div>
  </div>

  <div class="out-head">
    <span class="t" data-s="out_t"></span>
  </div>

  <div class="output">
    <div id="prompt"></div>
    <div class="actions">
      <button id="copy" type="button" data-s="copy"></button>
      <span class="ok" id="ok" data-s="copied"></span>
    </div>
  </div>
  <p class="why" id="why"></p>

  <div class="rules" id="rules"></div>

  <p class="colo" id="colo"></p>
</div>

var lang="de", expOpen=false;
var $=function(id){return document.getElementById(id);};
function S(k){return STR[k][lang];}

/* ---------- Selects füllen (sprachabhängig, Auswahl erhalten) ---------- */
function fill(id){
  var sel=$(id);
  var keep=sel.selectedIndex;
  sel.innerHTML="";
  OPT[id].forEach(function(o,i){
    var op=document.createElement("option");
    op.value=(o.v?o.v+":":"")+i;
    op.textContent=(lang==="de")?o.l:(o.le||o.l);
    sel.appendChild(op);
  });
  if(keep>=0)sel.selectedIndex=keep;
}
function fillAll(){["zweck","typ","stil","farbe","format","detail","grund","stimmung"].forEach(fill);}
function buildBias(preserve){
  var wrap=$("biaslist");
  var saved=[];
  if(preserve){wrap.querySelectorAll("input").forEach(function(c,i){saved[i]=c.checked;});}
  wrap.innerHTML="";
  OPT.bias.forEach(function(o,i){
    var lb=document.createElement("label");
    var cb=document.createElement("input");
    cb.type="checkbox";cb.id="bias_"+i;
    cb.checked=preserve?!!saved[i]:(i===0);
    cb.addEventListener("change",build);
    lb.appendChild(cb);
    var sp=document.createElement("span");
    sp.textContent=(lang==="de")?o.l:(o.le||o.l);
    lb.appendChild(sp);
    wrap.appendChild(lb);
  });
}

function opt(id){
  var v=$(id).value;
  var i=parseInt(v.replace(/^[a-z]+:/,""),10);
  return {o:OPT[id][i],custom:v.indexOf("custom:")===0,palette:v.indexOf("palette:")===0};
}
function customVal(id){var e=$(id+"_c");return e?e.value.trim():"";}

/* ---------- statische UI-Texte anwenden ---------- */
function applyUI(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-s]").forEach(function(e){e.innerHTML=S(e.getAttribute("data-s"));});
  document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=STR[e.getAttribute("data-p")][lang];});
  $("why").innerHTML=S("why");
  $("colo").innerHTML=S("colo");
  var r=$("rules");r.innerHTML="";
  STR.rules[lang].forEach(function(pair){
    var d=document.createElement("div");
    d.innerHTML="<b>"+pair[0]+"</b>"+pair[1];
    r.appendChild(d);
  });
}

/* ---------- Expertenmodus ---------- */
function typKey(){return opt("typ").o.k||"generic";}
function buildExpert(preserve){
  var k=typKey();
  var wrap=$("expfields");
  var saved=[];
  if(preserve){
    wrap.querySelectorAll("select").forEach(function(s,i){
      saved[i]={v:s.value,c:($("exp_"+i+"_c")||{}).value||""};
    });
  }
  wrap.innerHTML="";
  (EXPERT[k]||EXPERT.generic).forEach(function(f,fi){
    var d=document.createElement("div");
    d.className="field";
    var lb=document.createElement("label");lb.textContent=f.label[lang];d.appendChild(lb);
    var sel=document.createElement("select");sel.id="exp_"+fi;
    var none=document.createElement("option");none.value="";none.textContent=S("exp_none");sel.appendChild(none);
    f.opts.forEach(function(o,oi){
      var op=document.createElement("option");op.value=String(oi);op.textContent=(lang==="de")?o.l:(o.le||o.l);sel.appendChild(op);
    });
    var cu=document.createElement("option");cu.value="custom";cu.textContent=S("exp_custom");sel.appendChild(cu);
    d.appendChild(sel);
    var inp=document.createElement("input");inp.type="text";inp.className="custom";inp.id="exp_"+fi+"_c";
    inp.placeholder=S("p_expcustom");d.appendChild(inp);
    wrap.appendChild(d);
    if(preserve&&saved[fi]){
      sel.value=saved[fi].v;
      if(sel.value===""&&saved[fi].v!==""){sel.value="";}
      inp.value=saved[fi].c;
      inp.classList.toggle("show",sel.value==="custom");
    }
    sel.addEventListener("change",function(){
      inp.classList.toggle("show",sel.value==="custom");
      build();
    });
    inp.addEventListener("input",build);
  });
  var tl=opt("typ").o;
  $("expctx").textContent=S("exp_ctx")+((lang==="de")?tl.l:(tl.le||tl.l)).replace(" …","").replace("Custom","custom");
}
function expertParts(){
  if(!expOpen)return [];
  var k=typKey(),parts=[];
  (EXPERT[k]||EXPERT.generic).forEach(function(f,fi){
    var sel=$("exp_"+fi);
    if(!sel||sel.value==="")return;
    if(sel.value==="custom"){
      var t=($("exp_"+fi+"_c").value||"").trim();
      if(t)parts.push(t.replace(/[.!?]?$/,"."));
    }else{
      var o=f.opts[parseInt(sel.value,10)];
      parts.push(lang==="de"?o.de:o.en);
    }
  });
  var free=$("expfree").value.trim();
  if(free)parts.push(free.replace(/[.!?]?$/,"."));
  return parts;
}

/* ---------- Farbsatz ---------- */
function colorSentence(){
  var f=opt("farbe");
  var de=lang==="de";
  if(f.palette){
    var m=[];
    var p=$("col_p").value.trim(),s=$("col_s").value.trim(),a=$("col_a").value.trim(),b=$("col_b").value.trim();
    if(de){
      if(p)m.push("Primärfarbe "+p);
      if(s)m.push("Sekundärfarbe "+s);
      if(a)m.push("Akzentfarbe "+a);
      if(b)m.push("Hintergrund in "+b);
      if(!m.length)return "Verwende eine feste Farbpalette aus 3–5 Farben.";
      return "Verwende eine feste Farbpalette – "+m.join(", ")+". Keine weiteren Farben.";
    }else{
      if(p)m.push("primary colour "+p);
      if(s)m.push("secondary colour "+s);
      if(a)m.push("accent colour "+a);
      if(b)m.push("background in "+b);
      if(!m.length)return "Use a fixed palette of 3–5 colours.";
      return "Use a fixed colour palette – "+m.join(", ")+". No other colours.";
    }
  }
  if(f.custom){
    var cv=customVal("farbe");
    var t=f.o[de?"de":"en"]||"";
    return t.replace("{X}",cv||(de?"[deine Farbe]":"[your colour]"));
  }
  return f.o[de?"de":"en"];
}

/* ---------- Prompt bauen ---------- */
function build(){
  var z=opt("zweck"),t=opt("typ"),s=opt("stil"),fo=opt("format"),
      d=opt("detail"),g=opt("grund"),st=opt("stimmung");
  var de=lang==="de";
  var biasParts=[];
  OPT.bias.forEach(function(o,i){
    var cb=$("bias_"+i);
    if(cb&&cb.checked)biasParts.push(o[de?"de":"en"]);
  });
  var bv=$("bias_c").value.trim();
  if(bv)biasParts.push((de?"Achte bei der Darstellung besonders auf: ":"Pay particular attention in the depiction to: ")+bv+".");
  var biasSatz=biasParts.join(" ");
  var altSatz=$("alttext").checked
    ?(de?"Formuliere zusätzlich einen Alternativtext, der die zentrale Bildaussage für Screenreader beschreibt."
        :"Additionally, provide an alt text describing the image's key message for screen readers.")
    :"";
  $("stilhint").textContent=s.o.warn?S("warn"):"";

  var typTxt=t.custom?(customVal("typ")||(de?"ein Bild":"an image")):t.o[de?"de":"en"];
  var stilTxt=s.custom?customVal("stil"):s.o[de?"de":"en"];
  var foTxt=fo.custom?customVal("format"):fo.o[de?"de":"en"];
  var zTxt=z.custom?customVal("zweck"):z.o[de?"de":"en"];

  var s1=(de?"Erstelle ":"Create ")+typTxt+(stilTxt?" "+stilTxt:"")+(foTxt?" "+foTxt:"")+".";
  var zweckSatz=zTxt?(de?"Das Bild wird für "+zTxt+" verwendet.":"The image will be used for "+zTxt+"."):"";
  var neg=$("nicht").value.trim();
  var negSatz=neg?(de?"Verzichte auf: "+neg+".":"Do not include: "+neg+"."):"";
  var serieSatz=$("serie").checked
    ?(de?"Das Bild ist Teil einer Serie: Verwende exakt denselben Stil, dieselbe Farbpalette und dasselbe Kompositionsschema wie bei den übrigen Bildern der Serie."
        :"This image is part of a series: use exactly the same style, colour palette and compositional scheme as the other images in the series.")
    :"";

  var parts=[
    '<span class="ph">'+PH[de?"de":"en"]+"</span>",
    s1,colorSentence(),d.o[de?"de":"en"],g.o[de?"de":"en"],st.o[de?"de":"en"],biasSatz
  ].concat(expertParts()).concat([
    zweckSatz,negSatz,serieSatz,altSatz,
    '<span class="fix">'+FIX[de?"de":"en"]+"</span>"
  ]);
  $("prompt").innerHTML=parts.filter(Boolean).join(" ");
}

function copyPrompt(){
  var text=$("prompt").innerText;
  function done(){var ok=$("ok");ok.classList.add("show");setTimeout(function(){ok.classList.remove("show");},2200);}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){fallback();done();});
  }else{fallback();done();}
}

/* ---------- Events ---------- */
document.querySelectorAll("#form select").forEach(function(sel){
  sel.addEventListener("change",function(){
    var c=$(sel.id+"_c");
    if(c){c.classList.toggle("show",sel.value.indexOf("custom:")===0);}
    if(sel.id==="farbe"){$("palette").classList.toggle("show",sel.value.indexOf("palette:")===0);}
    if(sel.id==="typ"){buildExpert(false);}
    build();
  });
});
document.querySelectorAll("#form input, #palette input").forEach(function(inp){
  inp.addEventListener("input",build);
  inp.addEventListener("change",build);
});
$("expfree").addEventListener("input",build);
$("exphead").addEventListener("click",function(){
  expOpen=!expOpen;
  $("exphead").classList.toggle("open",expOpen);
  $("expbody").classList.toggle("show",expOpen);
  build();
});
function setLang(l){
  lang=l;
  $("de").classList.toggle("on",l==="de");
  $("en").classList.toggle("on",l==="en");
  fillAll();
  applyUI();
  buildExpert(true);
  buildBias(true);
  build();
}
$("de").addEventListener("click",function(){setLang("de");});
$("en").addEventListener("click",function(){setLang("en");});
$("copy").addEventListener("click",copyPrompt);

/* ---------- Start ---------- */
fillAll();
applyUI();
buildExpert(false);
buildBias(false);
build();
})();
</script>
</body>
